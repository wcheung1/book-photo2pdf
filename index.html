<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>書本掃描轉 PDF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='48' font-size='48'%3E%F0%9F%93%95%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0f172a;--card:#1e293b;--card2:#334155;--text:#f1f5f9;--muted:#94a3b8;
  --primary:#38bdf8;--primary-d:#0ea5e9;--ok:#34d399;--warn:#fbbf24;--danger:#f87171;
  --accent:#a78bfa;--border:#475569;--shutter:#ef4444;--radius:14px;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Hiragino Sans GB","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;overflow:hidden}
button,input{font-family:inherit}
.app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;position:relative}
.screen{display:none;flex-direction:column;flex:1;min-height:0;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
.screen.active{display:flex}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-shrink:0}
.topbar h1{flex:1;font-size:1.15rem;margin:0;font-weight:700}
.btn{border:none;border-radius:12px;padding:12px 16px;font-size:.95rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,background .15s,opacity .15s;color:#fff;background:var(--card2)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#0f172a}
.btn-ok{background:var(--ok);color:#064e3b}
.btn-danger{background:var(--danger);color:#450a0a}
.btn-accent{background:var(--accent);color:#1e1b4b}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn-icon{width:42px;height:42px;padding:0;border-radius:12px;flex-shrink:0}
.btn-block{width:100%}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:8px}
.hero-icon{font-size:3.2rem;line-height:1}
.hero h2{margin:0;font-size:1.45rem}
.hero p{margin:0;color:var(--muted);font-size:.95rem;max-width:280px;line-height:1.45}
.entry-grid{display:grid;gap:12px;width:100%;max-width:340px}
.entry-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;transition:border-color .15s,background .15s}
.entry-card:hover,.entry-card:focus{border-color:var(--primary);outline:none}
.entry-card .ico{font-size:2rem}
.entry-card strong{font-size:1.05rem}
.entry-card span{font-size:.8rem;color:var(--muted)}
.fold{margin-top:8px;width:100%;max-width:340px}
.fold summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:6px;list-style:none;text-align:center}
.fold summary::-webkit-details-marker{display:none}
.fold[open] summary{color:var(--primary)}
.fold .body{background:var(--card);border-radius:12px;padding:12px;font-size:.85rem;color:var(--muted);line-height:1.5;text-align:left;margin-top:6px}
.cam-wrap{flex:1;min-height:0;position:relative;background:#000;border-radius:var(--radius);overflow:hidden;display:flex;align-items:center;justify-content:center}
#camVideo,#camCanvas{width:100%;height:100%;object-fit:cover}
.cam-guide{position:absolute;inset:8%;border:2px dashed rgba(56,189,248,.7);border-radius:8px;pointer-events:none}
.cam-guide::before{content:"";position:absolute;left:50%;top:5%;bottom:5%;width:2px;background:rgba(167,139,250,.75);transform:translateX(-50%)}
.cam-guide-label{position:absolute;top:4px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.75);color:var(--primary);font-size:.7rem;padding:2px 8px;border-radius:8px;white-space:nowrap}
.cam-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-shrink:0}
.shutter{width:68px;height:68px;border-radius:50%;border:4px solid #fff;background:var(--shutter);box-shadow:0 0 0 4px rgba(239,68,68,.35);padding:0}
.shutter:active{transform:scale(.92)}
.stats{font-size:.8rem;color:var(--muted);text-align:center}
.list-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;flex-shrink:0}
.chip{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:.8rem;color:var(--muted)}
.chip strong{color:var(--text)}
.photo-list{flex:1 1 0;height:0;overflow-y:scroll;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;padding-bottom:24px;min-height:0;touch-action:pan-y}
.photo-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px;touch-action:pan-y}
.photo-card.dragging{opacity:.85;border-color:var(--primary);box-shadow:0 8px 24px rgba(0,0,0,.35)}
.photo-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.photo-head .actions{display:flex;gap:4px;flex-wrap:wrap;width:100%}
.drag-handle{cursor:grab;color:var(--muted);font-size:1.25rem;padding:8px 10px;user-select:none;touch-action:none;-webkit-user-select:none}
.photo-title{flex:1;font-size:.85rem;font-weight:600}
.pages-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pages-row.single{grid-template-columns:1fr}
.page-thumb{background:#0b1220;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:3/4;border:1px solid var(--border)}
.page-thumb img,.page-thumb canvas{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.page-badge{position:absolute;top:4px;left:4px;background:rgba(15,23,42,.85);font-size:.65rem;padding:2px 6px;border-radius:6px;color:var(--primary)}
.page-actions{position:absolute;bottom:4px;right:4px;display:flex;gap:4px}
.bottom-bar{display:flex;gap:8px;flex-shrink:0;padding-top:8px;border-top:1px solid var(--border);margin-top:4px;align-items:stretch}
.bottom-bar .btn{white-space:nowrap;flex-shrink:0}
.bottom-bar .btn-block{flex:1;flex-shrink:1;min-width:0}
.progress-panel{display:none;position:fixed;inset:0;background:rgba(15,23,42,.82);z-index:100;align-items:center;justify-content:center;padding:20px}
.progress-panel.show{display:flex}
.progress-box{background:var(--card);border-radius:16px;padding:22px 20px;width:100%;max-width:300px;text-align:center}
.progress-bar{height:8px;background:var(--card2);border-radius:999px;overflow:hidden;margin:14px 0}
.progress-bar>i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px;transition:width .2s}
.modal{display:none;position:fixed;inset:0;z-index:90;background:rgba(15,23,42,.9);flex-direction:column;padding:10px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.modal.show{display:flex}
.modal-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;max-width:720px;margin:0 auto;width:100%}
.adjust-stage{flex:1;min-height:0;display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:640px){.adjust-stage{grid-template-columns:1fr 1fr}}
.adjust-canvas-wrap{position:relative;background:#000;border-radius:12px;overflow:hidden;min-height:180px;touch-action:none}
#adjustCanvas,#previewCanvas{width:100%;height:100%;display:block;object-fit:contain}
.preview-wrap{background:var(--card);border-radius:12px;overflow:hidden;min-height:140px;display:flex;flex-direction:column}
.preview-wrap h3{margin:0;padding:8px 10px;font-size:.8rem;color:var(--muted);border-bottom:1px solid var(--border)}
.preview-pages{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:6px;min-height:0}
.preview-pages.single{grid-template-columns:1fr}
.preview-pages canvas{width:100%;height:100%;object-fit:contain;background:#000;border-radius:6px;max-height:280px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(160%);background:var(--card2);color:var(--text);padding:10px 16px;border-radius:12px;font-size:.85rem;z-index:200;transition:transform .25s;max-width:min(92%,340px);text-align:center;border:1px solid var(--border);line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.warn{border-color:var(--warn);color:var(--warn)}
.toast.err{border-color:var(--danger);color:var(--danger)}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.settings-panel{display:none;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;font-size:.85rem}
.settings-panel.open{display:block}
.settings-panel label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.settings-panel label:last-child{border-bottom:none}
.settings-panel select,.settings-panel input[type=range]{max-width:140px}
.lib-status{font-size:.75rem;color:var(--muted);margin-top:6px}
.lib-status.ok{color:var(--ok)}
.lib-status.fail{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:.9rem}
.kbd-hint{font-size:.7rem;color:var(--muted);text-align:center;margin-top:4px}
.mode-toggle{display:flex;gap:6px;flex-shrink:0}
.mode-toggle .btn{flex:1}
.mode-toggle .btn.on{background:var(--primary);color:#0f172a;border-color:var(--primary)}
.zoom-fab{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:5}
.zoom-fab .btn{width:40px;height:40px;padding:0;border-radius:10px;background:rgba(15,23,42,.8);border:1px solid var(--border)}
@media(max-width:360px){
  .btn{padding:10px 12px;font-size:.88rem}
  .shutter{width:60px;height:60px}
  .hero h2{font-size:1.25rem}
  .page-actions .btn-sm{padding:6px 8px;font-size:.75rem}
}
</style>
</head>
<body>
<div class="app" id="app">

<!-- HOME -->
<section class="screen active" id="screen-home">
  <div class="topbar">
    <h1>📕 書本掃描</h1>
    <button class="btn btn-icon btn-ghost" id="btnHomeSettings" title="設定" type="button">⚙️</button>
  </div>
  <div class="settings-panel" id="homeSettings">
    <label>輸出畫質
      <select id="setQuality"><option value="0.85">標準</option><option value="0.95">高清</option><option value="0.7">慳位</option></select>
    </label>
    <label>處理解析度（px）
      <select id="setPdfWidth"><option value="1200">1200</option><option value="1600" selected>1600</option><option value="2000">2000</option></select>
    </label>
    <div class="lib-status" id="libStatus">程式庫載入緊…</div>
  </div>
  <div class="hero">
    <div class="hero-icon">📖➡️📄</div>
    <h2>影書變 PDF</h2>
    <p>一張相切左右兩頁，自動拉直，喺你手機本地處理，唔會上傳。</p>
    <div class="entry-grid">
      <button class="entry-card" id="btnOpenCamera" type="button">
        <span class="ico">📷</span>
        <strong>開相機影書</strong>
        <span>即時預覽 · 逐頁影</span>
      </button>
      <button class="entry-card" id="btnOpenUpload" type="button">
        <span class="ico">🖼️</span>
        <strong>上載相片</strong>
        <span>一次過揀多張 · 自動排次序</span>
      </button>
    </div>
    <details class="fold">
      <summary>💡 提示</summary>
      <div class="body">打開本書，左右兩頁一齊入鏡。影斜咗或者近書脊彎曲都得，之後會自動拉直。想再準啲可以入「手動調整」拖四個角同書脊線。</div>
    </details>
  </div>
  <div class="bottom-bar" id="homeBottom" style="display:none">
    <button class="btn btn-primary btn-block" id="btnGoList" type="button">📋 睇清單／出 PDF</button>
  </div>
</section>

<!-- CAMERA -->
<section class="screen" id="screen-camera">
  <div class="topbar">
    <button class="btn btn-icon btn-ghost" id="btnCamBack" type="button">←</button>
    <h1>影書</h1>
    <button class="btn btn-sm btn-primary" id="btnCamToList" type="button">清單</button>
  </div>
  <div class="cam-wrap" id="camWrap">
    <video id="camVideo" playsinline autoplay muted></video>
    <canvas id="camCanvas" style="display:none"></canvas>
    <div class="cam-guide"><span class="cam-guide-label">左頁 ┃ 右頁</span></div>
  </div>
  <div class="stats" id="camStats">已影 0 張 · 共 0 頁</div>
  <div class="cam-bar">
    <button class="btn btn-ghost btn-sm" id="btnCamFallback" type="button">系統相機</button>
    <button class="shutter" id="btnShutter" type="button" title="快門" aria-label="快門"></button>
    <button class="btn btn-ghost btn-sm" id="btnCamFlip" type="button">轉鏡</button>
  </div>
</section>

<!-- LIST -->
<section class="screen" id="screen-list">
  <div class="topbar">
    <button class="btn btn-icon btn-ghost" id="btnListHome" type="button">←</button>
    <h1>頁面清單</h1>
    <button class="btn btn-icon btn-ghost" id="btnListAdd" type="button" title="加相">➕</button>
  </div>
  <div class="list-stats">
    <span class="chip">相 <strong id="statPhotos">0</strong></span>
    <span class="chip">頁 <strong id="statPages">0</strong></span>
    <span class="chip" style="flex:1;min-width:140px">只暫存在瀏覽器，關頁就冇</span>
  </div>
  <div class="photo-list" id="photoList">
    <div class="empty" id="listEmpty">未有相。撳上面 ➕ 或者返去開相機／上載。</div>
  </div>
  <div class="bottom-bar">
    <button class="btn btn-ghost" id="btnListCam" type="button">📷 影多啲</button>
    <button class="btn btn-danger btn-sm" id="btnClearAll" type="button">清空</button>
    <button class="btn btn-ok btn-block" id="btnExportPdf" type="button" disabled>📄 輸出 PDF</button>
  </div>
</section>

<!-- ADJUST MODAL -->
<div class="modal" id="modalAdjust">
  <div class="modal-body">
    <div class="topbar">
      <button class="btn btn-icon btn-ghost" id="btnAdjClose" type="button">←</button>
      <h1>手動調整</h1>
      <button class="btn btn-sm btn-ghost" id="btnAdjReset" type="button">重設</button>
    </div>
    <div class="mode-toggle" id="adjModeToggle">
      <button class="btn btn-sm btn-ghost" type="button" data-mode="dual" id="btnModeDual">📖 左右兩頁</button>
      <button class="btn btn-sm btn-ghost" type="button" data-mode="single" id="btnModeSingle">📄 淨係一頁</button>
    </div>
    <div class="adjust-stage">
      <div class="adjust-canvas-wrap" id="adjustWrap">
        <canvas id="adjustCanvas"></canvas>
        <div class="zoom-fab">
          <button class="btn" type="button" id="btnZoomOut" title="縮小">−</button>
          <button class="btn" type="button" id="btnZoomIn" title="放大">＋</button>
          <button class="btn" type="button" id="btnZoomReset" title="重設畫面">1:1</button>
        </div>
      </div>
      <div class="preview-wrap">
        <h3>即時預覽（左 → 右）</h3>
        <div class="preview-pages" id="adjPreview">
          <canvas id="prevLeft"></canvas>
          <canvas id="prevRight"></canvas>
        </div>
      </div>
    </div>
    <p class="kbd-hint">拖圓點＝角 · 拖方塊／邊線＝整條邊 · 拖緊會出放大鏡 · 雙指或＋− 放大</p>
    <div class="bottom-bar">
      <button class="btn btn-primary btn-block" id="btnAdjApply" type="button">✅ 用呢個結果</button>
    </div>
  </div>
</div>

<!-- PROGRESS -->
<div class="progress-panel" id="progressPanel">
  <div class="progress-box">
    <div id="progressTitle">處理緊…</div>
    <div class="progress-bar"><i id="progressFill"></i></div>
    <div id="progressText" style="font-size:.85rem;color:var(--muted)">0 / 0</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileUpload" class="hidden-file" accept="image/*" multiple>
<input type="file" id="fileCapture" class="hidden-file" accept="image/*" capture="environment">
<input type="file" id="fileReplace" class="hidden-file" accept="image/*" capture="environment">

</div>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script>
/* ========= 書本掃描轉 PDF — 全部本地處理 ========= */
(function () {
  'use strict';

  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

  const state = {
    photos: [], // {id, name, time, src, w, h, auto, manual, pages:[{id,side,dataUrl}]}
    facing: 'environment',
    stream: null,
    opencvReady: false,
    jspdfReady: false,
    exifrReady: false,
    sortable: null,
    adjust: null, // {photoId, corners:[4], spineX, selectedCorner}
    replaceTarget: null,
    quality: 0.85,
    pdfWidth: 1600,
    uid: 1
  };

  function nextId(p) { return (p || 'id') + '_' + (state.uid++); }

  function toast(msg, type) {
    const el = $('#toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove('show'), 2800);
  }

  function showScreen(id) {
    $$('.screen').forEach(s => s.classList.remove('active'));
    const sc = $('#screen-' + id);
    if (sc) sc.classList.add('active');
    if (id === 'list') renderList();
    if (id !== 'camera') stopCamera();
  }

  function updateHomeBottom() {
    $('#homeBottom').style.display = state.photos.length ? 'flex' : 'none';
  }

  function statsText() {
    const p = state.photos.length;
    const pages = state.photos.reduce((n, ph) => n + (ph.pages ? ph.pages.length : 0), 0);
    return { p, pages };
  }

  function refreshStats() {
    const { p, pages } = statsText();
    const cam = $('#camStats');
    if (cam) cam.textContent = `已影 ${p} 張 · 共 ${pages} 頁`;
    const sp = $('#statPhotos'), sg = $('#statPages');
    if (sp) sp.textContent = p;
    if (sg) sg.textContent = pages;
    const exp = $('#btnExportPdf');
    if (exp) exp.disabled = pages === 0;
    updateHomeBottom();
  }

  /* ----- Library load ----- */
  function updateLibStatus() {
    const el = $('#libStatus');
    const parts = [];
    parts.push(state.opencvReady ? 'OpenCV ✅' : 'OpenCV ⏳／後備模式');
    parts.push(window.jspdf ? 'jsPDF ✅' : 'jsPDF ❌');
    parts.push(window.exifr ? 'EXIF ✅' : 'EXIF 後備');
    el.textContent = parts.join(' · ');
    el.className = 'lib-status ' + (window.jspdf ? 'ok' : 'fail');
    state.jspdfReady = !!window.jspdf;
    state.exifrReady = !!window.exifr;
  }

  function loadOpenCV() {
    const urls = [
      'https://cdn.jsdelivr.net/npm/@techstark/opencv-js@4.9.0-release.1/dist/opencv.js',
      'https://unpkg.com/@techstark/opencv-js@4.9.0-release.1/dist/opencv.js'
    ];
    return new Promise((resolve) => {
      if (window.cv && cv.Mat) { state.opencvReady = true; resolve(true); return; }
      let done = false;
      const finish = (ok) => {
        if (done) return;
        done = true;
        state.opencvReady = !!ok;
        updateLibStatus();
        resolve(!!ok);
      };
      function hookReady() {
        try {
          if (!window.cv) return false;
          // 有啲 build 有 then 但唔係標準 Promise，唔好硬 call .catch
          if (cv.Mat) { finish(true); return true; }
          if (typeof cv.then === 'function') {
            try {
              cv.then(function (real) {
                if (real && real.Mat) window.cv = real;
                finish(!!(window.cv && window.cv.Mat));
              });
            } catch (e) { /* 轉用下面 onRuntimeInitialized／輪詢 */ }
          }
          const prev = cv.onRuntimeInitialized;
          cv.onRuntimeInitialized = function () {
            if (typeof prev === 'function') try { prev(); } catch (e) {}
            finish(!!cv.Mat);
          };
          // 輪詢後備（有啲 build 唔會 call onRuntimeInitialized）
          let n = 0;
          const timer = setInterval(() => {
            n++;
            if (window.cv && cv.Mat) { clearInterval(timer); finish(true); }
            else if (n > 150) { clearInterval(timer); if (!done) finish(!!(window.cv && cv.Mat)); }
          }, 100);
          return true;
        } catch (e) {
          console.warn('OpenCV hook', e);
          return false;
        }
      }
      function tryUrl(i) {
        if (done) return;
        if (i >= urls.length) { finish(false); return; }
        const s = document.createElement('script');
        s.async = true;
        s.src = urls[i];
        s.onload = () => {
          if (!hookReady()) tryUrl(i + 1);
        };
        s.onerror = () => tryUrl(i + 1);
        document.head.appendChild(s);
      }
      tryUrl(0);
      setTimeout(() => { if (!done) finish(!!(window.cv && cv.Mat)); }, 35000);
    });
  }

  /* ----- Image helpers ----- */
  function loadImage(src) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = src;
    });
  }

  function fileToDataURL(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }

  async function getCaptureTime(file) {
    try {
      if (window.exifr) {
        const ex = await exifr.parse(file, { pick: ['DateTimeOriginal', 'CreateDate', 'ModifyDate'] });
        if (ex) {
          const d = ex.DateTimeOriginal || ex.CreateDate || ex.ModifyDate;
          if (d) return new Date(d).getTime();
        }
      }
    } catch (e) { /* ignore */ }
    if (file.lastModified) return file.lastModified;
    // natural name fallback handled in sort
    return 0;
  }

  function naturalName(a, b) {
    return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
  }

  /* ----- Book detection & warp (OpenCV or fallback) ----- */
  function defaultCorners(w, h) {
    // 偵唔到就用「成幅圖」——只留少少邊，唔好四點疊埋一個角
    const m = Math.max(2, Math.min(w, h) * 0.008);
    return [
      { x: m, y: m },
      { x: w - m, y: m },
      { x: w - m, y: h - m },
      { x: m, y: h - m }
    ];
  }

  function quadArea(c) {
    // shoelace
    let a = 0;
    for (let i = 0; i < 4; i++) {
      const j = (i + 1) % 4;
      a += c[i].x * c[j].y - c[j].x * c[i].y;
    }
    return Math.abs(a) / 2;
  }

  function cornersLookValid(corners, w, h) {
    if (!corners || corners.length !== 4) return false;
    for (const p of corners) {
      if (!isFinite(p.x) || !isFinite(p.y)) return false;
      if (p.x < -w * 0.05 || p.y < -h * 0.05 || p.x > w * 1.05 || p.y > h * 1.05) return false;
    }
    const area = quadArea(corners);
    if (area < w * h * 0.05) return false; // 太細／疊埋
    const xs = corners.map(p => p.x), ys = corners.map(p => p.y);
    if (Math.max(...xs) - Math.min(...xs) < w * 0.12) return false;
    if (Math.max(...ys) - Math.min(...ys) < h * 0.12) return false;
    // 任意兩點太近
    for (let i = 0; i < 4; i++) {
      for (let j = i + 1; j < 4; j++) {
        if (Math.hypot(corners[i].x - corners[j].x, corners[i].y - corners[j].y) < Math.min(w, h) * 0.04) return false;
      }
    }
    return true;
  }

  function sanitizeDetect(res, w, h) {
    let corners = res && res.corners;
    let spineX = res && res.spineX;
    let dual = res && res.dual;
    if (spineX && typeof spineX === 'object') spineX = spineX.x;
    if (!cornersLookValid(corners, w, h)) {
      corners = defaultCorners(w, h);
      spineX = w * 0.5;
      dual = guessDual(w, h, spineX, 0, w);
      return { corners, spineX, dual, failed: true };
    }
    spineX = isFinite(spineX) ? spineX : w * 0.5;
    dual = !!dual;
    return { corners, spineX, dual, failed: false };
  }

  function detectBookAuto(img) {
    const w = img.naturalWidth || img.width;
    const h = img.naturalHeight || img.height;
    let res = null;
    if (state.opencvReady && window.cv && cv.Mat) {
      try {
        res = detectWithOpenCV(img, w, h);
      } catch (e) {
        console.warn('OpenCV detect fail', e);
      }
    }
    if (!res) res = detectFallback(img, w, h);
    return sanitizeDetect(res, w, h);
  }

  function detectFallback(img, w, h) {
    // 亮度／對比搵紙面；失敗就交 sanitize 用成幅圖
    try {
      const c = document.createElement('canvas');
      const maxSide = 640;
      const scale = Math.min(1, maxSide / Math.max(w, h));
      const sw = Math.round(w * scale), sh = Math.round(h * scale);
      c.width = sw; c.height = sh;
      const ctx = c.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, sw, sh);
      const data = ctx.getImageData(0, 0, sw, sh).data;
      let sum = 0, nSamp = 0;
      for (let i = 0; i < data.length; i += 16) {
        sum += (data[i] + data[i + 1] + data[i + 2]) / 3;
        nSamp++;
      }
      const mean = sum / nSamp;
      const candidates = [];
      for (const delta of [6, 14, 24, 36, -8]) {
        const thr = mean + delta;
        let x0 = sw, y0 = sh, x1 = 0, y1 = 0, n = 0;
        for (let y = 0; y < sh; y += 2) {
          for (let x = 0; x < sw; x += 2) {
            const i = (y * sw + x) * 4;
            const g = (data[i] + data[i + 1] + data[i + 2]) / 3;
            if (g > thr) {
              n++;
              if (x < x0) x0 = x; if (y < y0) y0 = y;
              if (x > x1) x1 = x; if (y > y1) y1 = y;
            }
          }
        }
        if (n < (sw * sh) * 0.06) continue;
        const bw = (x1 - x0) / scale, bh = (y1 - y0) / scale;
        if (bw < w * 0.18 || bh < h * 0.18) continue;
        if (bw * bh > w * h * 0.97) continue;
        const pad = Math.round(Math.min(sw, sh) * 0.006);
        const corners = [
          { x: Math.max(0, x0 - pad) / scale, y: Math.max(0, y0 - pad) / scale },
          { x: Math.min(sw - 1, x1 + pad) / scale, y: Math.max(0, y0 - pad) / scale },
          { x: Math.min(sw - 1, x1 + pad) / scale, y: Math.min(sh - 1, y1 + pad) / scale },
          { x: Math.max(0, x0 - pad) / scale, y: Math.min(sh - 1, y1 + pad) / scale }
        ];
        if (!cornersLookValid(corners, w, h)) continue;
        candidates.push({
          corners,
          area: bw * bh,
          dual: guessDual(bw, bh, (corners[0].x + corners[1].x) / 2, corners[0].x, corners[1].x)
        });
      }
      if (candidates.length) {
        candidates.sort((a, b) => b.area - a.area);
        const best = candidates[0];
        const xs = best.corners.map(c => c.x);
        return { corners: best.corners, spineX: (Math.min(...xs) + Math.max(...xs)) / 2, dual: best.dual };
      }
    } catch (e) { /* fall through */ }
    return { corners: defaultCorners(w, h), spineX: w * 0.5, dual: guessDual(w, h, w * 0.5, 0, w) };
  }

  function guessDual(bw, bh, spineX, minX, maxX) {
    // 打開嘅書通常橫向闊過高；單頁／封面多數直向或者書脊好貼邊
    const aspect = bw / Math.max(1, bh);
    const t = (spineX - minX) / Math.max(1, maxX - minX);
    if (aspect < 1.05) return false; // 直向 → 單頁
    if (t < 0.28 || t > 0.72) return false;
    if (aspect >= 1.2) return true;
    return aspect >= 1.1;
  }

  function matToPts(mat, scale) {
    const pts = [];
    let arr = null;
    try {
      if (mat.data32F && mat.data32F.length >= 8) arr = Array.from(mat.data32F.subarray(0, 8));
      else if (mat.data32S && mat.data32S.length >= 8) arr = Array.from(mat.data32S.subarray(0, 8));
    } catch (e) { arr = null; }
    if (!arr) return null;
    for (let i = 0; i < 4; i++) pts.push({ x: arr[i * 2] / scale, y: arr[i * 2 + 1] / scale });
    return orderCorners(pts);
  }

  // 用 Canny + Hough 直線 → 交點組四邊形（跟你講嘅連續線／polygon 做法）
  function findQuadByHough(gray, sw, sh, scale, w, h) {
    try {
      let edges = new cv.Mat();
      let blur = new cv.Mat();
      cv.GaussianBlur(gray, blur, new cv.Size(3, 3), 0);
      cv.Canny(blur, edges, 50, 150);
      let lines = new cv.Mat();
      // rho, theta, threshold, minLineLength, maxLineGap
      cv.HoughLinesP(edges, lines, 1, Math.PI / 180, 60, Math.min(sw, sh) * 0.25, 20);
      const horiz = [], vert = [];
      for (let i = 0; i < lines.rows; i++) {
        const x1 = lines.data32S[i * 4], y1 = lines.data32S[i * 4 + 1];
        const x2 = lines.data32S[i * 4 + 2], y2 = lines.data32S[i * 4 + 3];
        const ang = Math.atan2(y2 - y1, x2 - x1);
        const len = Math.hypot(x2 - x1, y2 - y1);
        const a = ((ang % Math.PI) + Math.PI) % Math.PI;
        const item = { x1, y1, x2, y2, len, a };
        if (a < Math.PI * 0.2 || a > Math.PI * 0.8) horiz.push(item);
        else if (Math.abs(a - Math.PI / 2) < Math.PI * 0.2) vert.push(item);
      }
      edges.delete(); blur.delete(); lines.delete();
      if (horiz.length < 2 || vert.length < 2) return null;

      function lineKey(L, horizontal) {
        return horizontal ? (L.y1 + L.y2) / 2 : (L.x1 + L.x2) / 2;
      }
      function pickExtremes(arr, horizontal) {
        arr.sort((a, b) => lineKey(a, horizontal) - lineKey(b, horizontal));
        // 合併相近線：取最長
        const clusters = [];
        for (const L of arr) {
          const k = lineKey(L, horizontal);
          const last = clusters[clusters.length - 1];
          if (last && Math.abs(lineKey(last.best, horizontal) - k) < Math.min(sw, sh) * 0.06) {
            if (L.len > last.best.len) last.best = L;
          } else clusters.push({ best: L });
        }
        if (clusters.length < 2) return null;
        return [clusters[0].best, clusters[clusters.length - 1].best];
      }
      const H = pickExtremes(horiz, true);
      const V = pickExtremes(vert, false);
      if (!H || !V) return null;

      function intersect(A, B) {
        // infinite line intersect
        const x1 = A.x1, y1 = A.y1, x2 = A.x2, y2 = A.y2;
        const x3 = B.x1, y3 = B.y1, x4 = B.x2, y4 = B.y2;
        const den = (x1 - x2) * (y3 - y4) - (y1 - y2) * (x3 - x4);
        if (Math.abs(den) < 1e-6) return null;
        const px = ((x1 * y2 - y1 * x2) * (x3 - x4) - (x1 - x2) * (x3 * y4 - y3 * x4)) / den;
        const py = ((x1 * y2 - y1 * x2) * (y3 - y4) - (y1 - y2) * (x3 * y4 - y3 * x4)) / den;
        return { x: px / scale, y: py / scale };
      }
      const top = H[0].y1 + H[0].y2 < H[1].y1 + H[1].y2 ? H[0] : H[1];
      const bot = top === H[0] ? H[1] : H[0];
      const left = V[0].x1 + V[0].x2 < V[1].x1 + V[1].x2 ? V[0] : V[1];
      const right = left === V[0] ? V[1] : V[0];
      const tl = intersect(top, left), tr = intersect(top, right);
      const br = intersect(bot, right), bl = intersect(bot, left);
      if (!tl || !tr || !br || !bl) return null;
      const corners = orderCorners([tl, tr, br, bl]);
      if (!cornersLookValid(corners, w, h)) return null;
      // 拒絕「幾乎成幅」——通常係影到相框唔係書
      const xs = corners.map(c => c.x), ys = corners.map(c => c.y);
      const bw = Math.max(...xs) - Math.min(...xs);
      const bh = Math.max(...ys) - Math.min(...ys);
      if (bw * bh > w * h * 0.96) return null;
      return corners;
    } catch (e) {
      console.warn('Hough quad', e);
      return null;
    }
  }

  function detectWithOpenCV(img, w, h) {
    const maxSide = 900;
    const scale = Math.min(1, maxSide / Math.max(w, h));
    const sw = Math.round(w * scale), sh = Math.round(h * scale);
    const canvas = document.createElement('canvas');
    canvas.width = sw; canvas.height = sh;
    canvas.getContext('2d').drawImage(img, 0, 0, sw, sh);

    let src = cv.imread(canvas);
    let gray = new cv.Mat();
    let blur = new cv.Mat();
    let bright = new cv.Mat();
    let edges = new cv.Mat();
    let dil = new cv.Mat();
    let morph = new cv.Mat();
    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
    cv.GaussianBlur(gray, blur, new cv.Size(5, 5), 0);

    // 1) 紙面通常靚過地板：用 Otsu／高亮度 mask 搵書頁
    cv.threshold(blur, bright, 0, 255, cv.THRESH_BINARY + cv.THRESH_OTSU);
    // 如果 Otsu 揀咗暗底，反轉
    const meanBright = cv.mean(bright)[0];
    if (meanBright < 127) cv.bitwise_not(bright, bright);
    const k5 = cv.Mat.ones(5, 5, cv.CV_8U);
    cv.morphologyEx(bright, morph, cv.MORPH_CLOSE, k5);
    cv.morphologyEx(morph, morph, cv.MORPH_OPEN, k5);

    function bestQuadFrom(binMat) {
      let contours = new cv.MatVector();
      let hierarchy = new cv.Mat();
      cv.findContours(binMat, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);
      let best = null, bestScore = 0;
      const imgArea = sw * sh;
      for (let i = 0; i < contours.size(); i++) {
        const cnt = contours.get(i);
        const area = cv.contourArea(cnt);
        if (area < imgArea * 0.1 || area > imgArea * 0.92) continue;
        const peri = cv.arcLength(cnt, true);
        let approx = new cv.Mat();
        cv.approxPolyDP(cnt, approx, 0.025 * peri, true);
        let ptsMat = approx;
        if (approx.rows !== 4) {
          // 用最小外接矩形做四角
          const rect = cv.minAreaRect(cnt);
          ptsMat = new cv.Mat();
          cv.boxPoints(rect, ptsMat);
          approx.delete();
        }
        if (ptsMat.rows === 4 || ptsMat.cols === 4 || ptsMat.total() >= 4) {
          const score = area;
          if (score > bestScore) {
            bestScore = score;
            if (best) best.delete();
            best = ptsMat;
          } else ptsMat.delete();
        } else {
          ptsMat.delete();
        }
      }
      contours.delete(); hierarchy.delete();
      return best;
    }

    // 評分：寧取「明顯係書」嘅四邊形，唔好成幅相框
    function scoreQuadMat(mat) {
      const c = matToPts(mat, scale);
      if (!c || !cornersLookValid(c, w, h)) return -1;
      const xs = c.map(p => p.x), ys = c.map(p => p.y);
      const bw = Math.max(...xs) - Math.min(...xs);
      const bh = Math.max(...ys) - Math.min(...ys);
      const area = bw * bh;
      const fill = area / (w * h);
      if (fill < 0.1 || fill > 0.92) return -1;
      return area * (1 - Math.abs(fill - 0.55)); // 偏好佔畫面約一半幾
    }

    let best = bestQuadFrom(morph);
    let bestScore = best ? scoreQuadMat(best) : -1;
    if (best && bestScore < 0) { best.delete(); best = null; bestScore = -1; }

    // 2) Hough 直線組四邊形
    const houghCorners = findQuadByHough(gray, sw, sh, scale, w, h);
    // 3) Canny 輪廓
    cv.Canny(blur, edges, 40, 120);
    const k = cv.Mat.ones(3, 3, cv.CV_8U);
    cv.dilate(edges, dil, k);
    k.delete();
    let best2 = bestQuadFrom(dil);
    const s2 = best2 ? scoreQuadMat(best2) : -1;
    if (best2 && s2 > bestScore) {
      if (best) best.delete();
      best = best2; bestScore = s2;
    } else if (best2) best2.delete();

    k5.delete();

    let corners = null;
    if (houghCorners && cornersLookValid(houghCorners, w, h)) {
      corners = houghCorners;
    }
    if (best) {
      const fromMat = matToPts(best, scale);
      best.delete();
      if (fromMat && cornersLookValid(fromMat, w, h)) {
        const xs = fromMat.map(p => p.x), ys = fromMat.map(p => p.y);
        const fill = ((Math.max(...xs) - Math.min(...xs)) * (Math.max(...ys) - Math.min(...ys))) / (w * h);
        const hFill = corners ? ((Math.max(...corners.map(p=>p.x)) - Math.min(...corners.map(p=>p.x))) *
          (Math.max(...corners.map(p=>p.y)) - Math.min(...corners.map(p=>p.y)))) / (w * h) : 1;
        if (!corners || (fill < 0.92 && Math.abs(fill - 0.55) < Math.abs(hFill - 0.55))) {
          corners = fromMat;
        }
      }
    }
    if (corners) {
      const cx = (corners[0].x + corners[1].x + corners[2].x + corners[3].x) / 4;
      const cy = (corners[0].y + corners[1].y + corners[2].y + corners[3].y) / 4;
      corners = corners.map(pt => ({
        x: pt.x + (cx - pt.x) * 0.015,
        y: pt.y + (cy - pt.y) * 0.015
      }));
    } else {
      corners = detectFallback(img, w, h).corners;
    }

    const spineInfo = findSpine(gray, scale, corners, w, h, sw, sh);
    const spineX = typeof spineInfo === 'object' ? spineInfo.x : spineInfo;
    const spineScore = typeof spineInfo === 'object' ? spineInfo.score : 0;

    const xs = corners.map(c => c.x), ys = corners.map(c => c.y);
    const bw = Math.max(...xs) - Math.min(...xs);
    const bh = Math.max(...ys) - Math.min(...ys);
    let dual = guessDual(bw, bh, spineX, Math.min(...xs), Math.max(...xs));
    // 書脊訊號太弱 → 傾向單頁
    if (dual && spineScore > 0 && spineScore < (sh * 8)) dual = false;

    src.delete(); gray.delete(); blur.delete(); bright.delete();
    edges.delete(); dil.delete(); morph.delete();

    // 無效四邊形交俾外層 sanitize 用成幅圖
    return { corners, spineX, dual };
  }

  function orderCorners(pts) {
    // TL, TR, BR, BL
    const sorted = pts.slice().sort((a, b) => a.y - b.y);
    const top = sorted.slice(0, 2).sort((a, b) => a.x - b.x);
    const bot = sorted.slice(2, 4).sort((a, b) => a.x - b.x);
    return [top[0], top[1], bot[1], bot[0]];
  }

  function findSpine(grayMat, scale, corners, w, h, sw, sh) {
    try {
      const xs = corners.map(c => c.x * scale);
      const ys = corners.map(c => c.y * scale);
      const minX = Math.max(0, Math.floor(Math.min(...xs)));
      const maxX = Math.min(sw - 1, Math.ceil(Math.max(...xs)));
      const minY = Math.max(0, Math.floor(Math.min(...ys)));
      const maxY = Math.min(sh - 1, Math.ceil(Math.max(...ys)));
      const x0 = Math.floor(minX + (maxX - minX) * 0.32);
      const x1 = Math.ceil(minX + (maxX - minX) * 0.68);
      let bestX = Math.floor((minX + maxX) / 2), bestScore = -1;
      for (let x = x0; x <= x1; x++) {
        let score = 0;
        for (let y = minY + 2; y < maxY - 2; y++) {
          const i = y * sw + x;
          const l = grayMat.data[i - 1], r = grayMat.data[i + 1];
          score += Math.abs(r - l);
        }
        const centerBias = 1 - Math.abs((x - (minX + maxX) / 2) / ((maxX - minX) / 2 + 1)) * 0.12;
        score *= centerBias;
        if (score > bestScore) { bestScore = score; bestX = x; }
      }
      return { x: bestX / scale, score: bestScore };
    } catch (e) {
      return { x: w * 0.5, score: 0 };
    }
  }

  function interpEdge(c0, c1, t) {
    return { x: c0.x + (c1.x - c0.x) * t, y: c0.y + (c1.y - c0.y) * t };
  }

  function spinePoints(corners, spineX) {
    // Find t on top and bottom edges where x ≈ spineX
    function tOnEdge(a, b, sx) {
      const dx = b.x - a.x;
      if (Math.abs(dx) < 1e-6) return 0.5;
      return Math.max(0, Math.min(1, (sx - a.x) / dx));
    }
    const tt = tOnEdge(corners[0], corners[1], spineX);
    const tb = tOnEdge(corners[3], corners[2], spineX);
    return {
      top: interpEdge(corners[0], corners[1], tt),
      bot: interpEdge(corners[3], corners[2], tb),
      tTop: tt,
      tBot: tb
    };
  }

  function warpPage(img, quad, outW, outH, dewarp) {
    // quad: TL,TR,BR,BL in source
    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    if (state.opencvReady && window.cv && cv.Mat) {
      try {
        return warpOpenCV(img, quad, outW, outH, dewarp);
      } catch (e) {
        console.warn('warp opencv fail', e);
      }
    }
    return warpCanvas(img, quad, outW, outH);
  }

  function warpOpenCV(img, quad, outW, outH, dewarp) {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth || img.width;
    c.height = img.naturalHeight || img.height;
    c.getContext('2d').drawImage(img, 0, 0);
    let src = cv.imread(c);
    const srcTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      quad[0].x, quad[0].y, quad[1].x, quad[1].y,
      quad[2].x, quad[2].y, quad[3].x, quad[3].y
    ]);
    const dstTri = cv.matFromArray(4, 1, cv.CV_32FC2, [
      0, 0, outW - 1, 0, outW - 1, outH - 1, 0, outH - 1
    ]);
    let M = cv.getPerspectiveTransform(srcTri, dstTri);
    let dst = new cv.Mat();
    cv.warpPerspective(src, dst, M, new cv.Size(outW, outH), cv.INTER_LINEAR, cv.BORDER_REPLICATE);

    if (dewarp) {
      try {
        dst = simpleDewarp(dst);
      } catch (e) { /* keep perspective only */ }
    }

    const out = document.createElement('canvas');
    out.width = outW; out.height = outH;
    cv.imshow(out, dst);
    src.delete(); srcTri.delete(); dstTri.delete(); M.delete(); dst.delete();
    return out;
  }

  function simpleDewarp(mat) {
    // Column-wise vertical shift based on horizontal projection curvature near spine side
    // Lightweight approximation: detect top/bottom content edge per column and straighten
    const w = mat.cols, h = mat.rows;
    let gray = new cv.Mat();
    cv.cvtColor(mat, gray, cv.COLOR_RGBA2GRAY);
    const topEdge = new Float32Array(w);
    const botEdge = new Float32Array(w);
    const thresh = 28;
    for (let x = 0; x < w; x++) {
      let top = 0, bot = h - 1;
      for (let y = 0; y < h; y++) {
        if (gray.data[y * w + x] < 255 - thresh) { top = y; break; }
      }
      for (let y = h - 1; y >= 0; y--) {
        if (gray.data[y * w + x] < 255 - thresh) { bot = y; break; }
      }
      topEdge[x] = top;
      botEdge[x] = bot;
    }
    // Smooth edges
    const smooth = (arr) => {
      const o = new Float32Array(arr.length);
      for (let i = 0; i < arr.length; i++) {
        let s = 0, n = 0;
        for (let k = -8; k <= 8; k++) {
          const j = i + k;
          if (j >= 0 && j < arr.length) { s += arr[j]; n++; }
        }
        o[i] = s / n;
      }
      return o;
    };
    const st = smooth(topEdge), sb = smooth(botEdge);
    const avgTop = st.reduce((a, b) => a + b, 0) / w;
    const avgBot = sb.reduce((a, b) => a + b, 0) / w;

    // Build remap
    let mapX = new cv.Mat(h, w, cv.CV_32FC1);
    let mapY = new cv.Mat(h, w, cv.CV_32FC1);
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        mapX.floatPtr(y, x)[0] = x;
        const srcTop = st[x], srcBot = sb[x];
        const srcH = Math.max(1, srcBot - srcTop);
        const dstY = avgTop + (y / Math.max(1, h - 1)) * (avgBot - avgTop);
        // Map destination y back: content row fraction
        const frac = (y - avgTop) / Math.max(1, avgBot - avgTop);
        const srcY = srcTop + frac * srcH;
        mapY.floatPtr(y, x)[0] = Math.max(0, Math.min(h - 1, srcY));
      }
    }
    let out = new cv.Mat();
    cv.remap(mat, out, mapX, mapY, cv.INTER_LINEAR, cv.BORDER_REPLICATE);
    gray.delete(); mapX.delete(); mapY.delete();
    mat.delete();
    return out;
  }

  function warpCanvas(img, quad, outW, outH) {
    // Subdivision bilinear-ish warp using canvas by scanning destination
    const canvas = document.createElement('canvas');
    canvas.width = outW;
    canvas.height = outH;
    const ctx = canvas.getContext('2d');
    // Draw using two triangles (affine approx) — good enough fallback
    const srcC = document.createElement('canvas');
    const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
    srcC.width = iw; srcC.height = ih;
    srcC.getContext('2d').drawImage(img, 0, 0);
    // Use pattern fill via repeated small strips
    const steps = 40;
    for (let i = 0; i < steps; i++) {
      const t0 = i / steps, t1 = (i + 1) / steps;
      const top0 = interpEdge(quad[0], quad[1], t0);
      const top1 = interpEdge(quad[0], quad[1], t1);
      const bot0 = interpEdge(quad[3], quad[2], t0);
      const bot1 = interpEdge(quad[3], quad[2], t1);
      const dx0 = Math.round(t0 * outW), dx1 = Math.round(t1 * outW);
      // sample mid column from source strip ≈ drawImage with transform
      try {
        ctx.save();
        // Map source quad strip to dest rect strip approximately
        const sw = Math.hypot(top1.x - top0.x, top1.y - top0.y) || 1;
        // draw vertical strip by projecting
        for (let y = 0; y < outH; y++) {
          const v = y / (outH - 1 || 1);
          const sx0 = top0.x + (bot0.x - top0.x) * v;
          const sy0 = top0.y + (bot0.y - top0.y) * v;
          const sx1 = top1.x + (bot1.x - top1.x) * v;
          const sy1 = top1.y + (bot1.y - top1.y) * v;
          // one pixel row
          if (dx1 > dx0) {
            ctx.drawImage(srcC, sx0, sy0, Math.max(1, sx1 - sx0), 1.2, dx0, y, dx1 - dx0, 1);
          }
        }
        ctx.restore();
      } catch (e) { /* continue */ }
    }
    return canvas;
  }

  function quadSize(q) {
    const topW = Math.hypot(q[1].x - q[0].x, q[1].y - q[0].y);
    const botW = Math.hypot(q[2].x - q[3].x, q[2].y - q[3].y);
    const leftH = Math.hypot(q[3].x - q[0].x, q[3].y - q[0].y);
    const rightH = Math.hypot(q[2].x - q[1].x, q[2].y - q[1].y);
    return {
      topW: Math.max(1, (topW + botW) / 2),
      leftH: Math.max(1, (leftH + rightH) / 2)
    };
  }

  function splitAndWarp(img, corners, spineX, dual) {
    const sp = spinePoints(corners, spineX);
    const pdfW = state.pdfWidth;
    const pages = [];
    const doDewarp = pdfW >= 800;

    function warpKeepAspect(quad, side) {
      const qs = quadSize(quad);
      // 跟四邊形真實長闊比，唔好硬套 A4
      let outW = pdfW;
      let outH = Math.round(pdfW * (qs.leftH / qs.topW));
      outH = Math.max(200, Math.min(2800, outH));
      // 單頁極寬／極高時，改以短邊對齊 pdfW，避免爆記憶體又唔變形
      if (outH > pdfW * 2.8) {
        outH = Math.round(pdfW * 2.8);
        outW = Math.round(outH * (qs.topW / qs.leftH));
      }
      const canvas = warpPage(img, quad, outW, outH, doDewarp);
      return { id: nextId('pg'), side, dataUrl: canvas.toDataURL('image/jpeg', state.quality), aspect: qs.topW / qs.leftH };
    }

    if (!dual) {
      pages.push(warpKeepAspect(corners, 'single'));
      return pages;
    }

    const leftQuad = [corners[0], sp.top, sp.bot, corners[3]];
    const rightQuad = [sp.top, corners[1], corners[2], sp.bot];
    pages.push(warpKeepAspect(leftQuad, 'left'));
    pages.push(warpKeepAspect(rightQuad, 'right'));
    return pages;
  }

  function isLikelySinglePage(corners, spineX, w) {
    // If spine too close to edge, treat as single
    const xs = corners.map(c => c.x);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const t = (spineX - minX) / Math.max(1, maxX - minX);
    return t < 0.18 || t > 0.82;
  }

  async function processPhotoSrc(src, name, time) {
    const img = await loadImage(src);
    const w = img.naturalWidth, h = img.naturalHeight;
    let auto = detectBookAuto(img);
    const spineX = (auto.spineX && typeof auto.spineX === 'object') ? auto.spineX.x : auto.spineX;
    let dual = !!auto.dual;
    if (dual && isLikelySinglePage(auto.corners, spineX, w)) dual = false;
    // 封面／單頁失敗時唔好硬切兩邊
    if (auto.failed) dual = false;
    auto = { corners: auto.corners, spineX: spineX, dual, failed: !!auto.failed };
    const pages = splitAndWarp(img, auto.corners, auto.spineX, dual);
    return {
      id: nextId('ph'),
      name: name || 'photo',
      time: time || Date.now(),
      src,
      w, h,
      auto: JSON.parse(JSON.stringify(auto)),
      manual: null,
      pages
    };
  }

  /* ----- Progress ----- */
  function showProgress(show, title, cur, total) {
    const p = $('#progressPanel');
    if (!show) { p.classList.remove('show'); return; }
    p.classList.add('show');
    $('#progressTitle').textContent = title || '處理緊…';
    const t = total || 1, c = cur || 0;
    $('#progressFill').style.width = Math.round((c / t) * 100) + '%';
    $('#progressText').textContent = `${c} / ${t}`;
  }

  async function yieldToUI() {
    await new Promise(r => setTimeout(r, 16));
  }

  /* ----- Add photos ----- */
  async function addFiles(fileList, replaceId) {
    const files = Array.from(fileList || []).filter(f => f && f.type && f.type.startsWith('image/'));
    if (!files.length) { toast('搵唔到相片', 'warn'); return; }

    // Build with times then sort
    showProgress(true, '讀緊相片資訊…', 0, files.length);
    const items = [];
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const t = await getCaptureTime(f);
      const src = await fileToDataURL(f);
      items.push({ file: f, src, time: t || f.lastModified || 0, name: f.name || ('img' + i) });
      showProgress(true, '讀緊相片資訊…', i + 1, files.length);
      await yieldToUI();
    }
    items.sort((a, b) => {
      if (a.time !== b.time) return a.time - b.time;
      return naturalName(a.name, b.name);
    });

    showProgress(true, '切割同拉直緊…', 0, items.length);
    const newPhotos = [];
    for (let i = 0; i < items.length; i++) {
      try {
        const ph = await processPhotoSrc(items[i].src, items[i].name, items[i].time);
        newPhotos.push(ph);
      } catch (e) {
        console.error(e);
        toast('有張相處理唔到：' + items[i].name, 'err');
      }
      showProgress(true, `處理緊第 ${i + 1} / ${items.length} 張`, i + 1, items.length);
      await yieldToUI();
    }
    showProgress(false);

    if (replaceId) {
      const idx = state.photos.findIndex(p => p.id === replaceId);
      if (idx >= 0 && newPhotos[0]) {
        state.photos[idx] = newPhotos[0];
        toast('已補影取代');
      }
    } else {
      state.photos.push(...newPhotos);
      toast(`加咗 ${newPhotos.length} 張相`);
    }
    refreshStats();
    showScreen('list');
  }

  async function addDataUrlCapture(dataUrl) {
    showProgress(true, '處理緊呢張相…', 0, 1);
    await yieldToUI();
    try {
      const ph = await processPhotoSrc(dataUrl, 'camera_' + Date.now() + '.jpg', Date.now());
      state.photos.push(ph);
      toast('已影低 · 可以繼續影');
    } catch (e) {
      console.error(e);
      toast('處理失敗，試吓再影', 'err');
    }
    showProgress(false);
    refreshStats();
  }

  /* ----- Camera ----- */
  async function startCamera() {
    stopCamera();
    showScreen('camera');
    const video = $('#camVideo');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: { facingMode: { ideal: state.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
      });
      state.stream = stream;
      video.srcObject = stream;
      await video.play();
    } catch (e) {
      console.warn(e);
      toast('開唔到相機，可以用「系統相機」或者改上載', 'warn');
    }
  }

  function stopCamera() {
    if (state.stream) {
      state.stream.getTracks().forEach(t => t.stop());
      state.stream = null;
    }
    const v = $('#camVideo');
    if (v) v.srcObject = null;
  }

  async function shutter() {
    const video = $('#camVideo');
    if (!state.stream || !video.videoWidth) {
      toast('相機未就緒，試吓用系統相機', 'warn');
      return;
    }
    const canvas = $('#camCanvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    await addDataUrlCapture(dataUrl);
  }

  async function setPhotoMode(photoId, dual) {
    const ph = state.photos.find(p => p.id === photoId);
    if (!ph) return;
    showProgress(true, dual ? '切左右頁…' : '合併做單頁…', 1, 1);
    await yieldToUI();
    try {
      const img = await loadImage(ph.src);
      const base = ph.manual || ph.auto;
      const corners = base.corners.map(c => ({ ...c }));
      const spineX = base.spineX;
      if (ph.manual) {
        ph.manual = { corners, spineX, dual: !!dual };
      } else {
        ph.auto = { ...ph.auto, corners, spineX, dual: !!dual };
      }
      ph.pages = splitAndWarp(img, corners, spineX, !!dual);
      toast(dual ? '已改做左右兩頁' : '已合併做單頁');
    } catch (e) {
      console.error(e);
      toast('切換失敗', 'err');
    }
    showProgress(false);
    renderList();
  }

  /* ----- List render ----- */
  function sideLabel(side) {
    if (side === 'left') return '左頁';
    if (side === 'right') return '右頁';
    return '單頁';
  }

  function renderList() {
    const box = $('#photoList');
    const empty = $('#listEmpty');
    refreshStats();
    if (!state.photos.length) {
      box.innerHTML = '';
      const e = document.createElement('div');
      e.className = 'empty';
      e.id = 'listEmpty';
      e.textContent = '未有相。撳上面 ➕ 或者返去開相機／上載。';
      box.appendChild(e);
      if (state.sortable) { try { state.sortable.destroy(); } catch (e) {} state.sortable = null; }
      return;
    }
    box.innerHTML = '';
    state.photos.forEach((ph, idx) => {
      const card = document.createElement('div');
      card.className = 'photo-card';
      card.dataset.id = ph.id;
      const head = document.createElement('div');
      head.className = 'photo-head';
      const isDual = !!(ph.manual || ph.auto).dual;
      head.innerHTML = `<span class="drag-handle" title="拖去調次序">☰</span>
        <span class="photo-title">第 ${idx + 1} 張 · ${isDual ? '左右兩頁' : '單頁'}</span>`;
      const actions = document.createElement('div');
      actions.className = 'actions';
      const btnMode = document.createElement('button');
      btnMode.className = 'btn btn-sm ' + (isDual ? 'btn-ghost' : 'btn-primary');
      btnMode.type = 'button';
      btnMode.textContent = isDual ? '改單頁' : '改雙頁';
      btnMode.onclick = (e) => { e.stopPropagation(); setPhotoMode(ph.id, !isDual); };
      const btnAdj = document.createElement('button');
      btnAdj.className = 'btn btn-sm btn-accent';
      btnAdj.type = 'button';
      btnAdj.textContent = '調整';
      btnAdj.onclick = (e) => { e.stopPropagation(); openAdjust(ph.id); };
      const btnRep = document.createElement('button');
      btnRep.className = 'btn btn-sm btn-ghost';
      btnRep.type = 'button';
      btnRep.textContent = '補影';
      btnRep.onclick = (e) => { e.stopPropagation(); state.replaceTarget = ph.id; $('#fileReplace').click(); };
      const btnDel = document.createElement('button');
      btnDel.className = 'btn btn-sm btn-danger';
      btnDel.type = 'button';
      btnDel.textContent = '刪除';
      btnDel.onclick = (e) => {
        e.stopPropagation();
        state.photos = state.photos.filter(p => p.id !== ph.id);
        toast('已刪除');
        renderList();
      };
      actions.append(btnMode, btnAdj, btnRep, btnDel);
      head.appendChild(actions);
      card.appendChild(head);

      const row = document.createElement('div');
      row.className = 'pages-row' + (ph.pages.length === 1 ? ' single' : '');
      ph.pages.forEach(pg => {
        const th = document.createElement('div');
        th.className = 'page-thumb';
        const badge = document.createElement('span');
        badge.className = 'page-badge';
        badge.textContent = sideLabel(pg.side);
        const im = document.createElement('img');
        im.src = pg.dataUrl;
        im.alt = sideLabel(pg.side);
        th.append(badge, im);
        row.appendChild(th);
      });
      card.appendChild(row);
      box.appendChild(card);
    });

    if (state.sortable) { try { state.sortable.destroy(); } catch (e) {} state.sortable = null; }
    if (window.Sortable) {
      state.sortable = Sortable.create(box, {
        handle: '.drag-handle',
        animation: 150,
        ghostClass: 'dragging',
        delay: 120,
        delayOnTouchOnly: true,
        touchStartThreshold: 6,
        onEnd: () => {
          const ids = $$('.photo-card', box).map(c => c.dataset.id);
          state.photos.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id));
          renderList();
          toast('次序已更新');
        }
      });
    }
  }

  /* ----- Manual adjust ----- */
  function syncAdjModeButtons() {
    const adj = state.adjust;
    if (!adj) return;
    const d = $('#btnModeDual'), s = $('#btnModeSingle');
    if (d) d.classList.toggle('on', !!adj.dual);
    if (s) s.classList.toggle('on', !adj.dual);
  }

  function openAdjust(photoId) {
    const ph = state.photos.find(p => p.id === photoId);
    if (!ph) return;
    const base = ph.manual || ph.auto;
    state.adjust = {
      photoId,
      corners: base.corners.map(c => ({ ...c })),
      spineX: base.spineX,
      dual: !!base.dual,
      selected: 0,
      img: null,
      fitScale: 1,
      zoom: 1,
      panX: 0,
      panY: 0,
      ox: 0, oy: 0,
      scale: 1,
      dpr: devicePixelRatio
    };
    $('#modalAdjust').classList.add('show');
    syncAdjModeButtons();
    loadImage(ph.src).then(img => {
      if (!state.adjust || state.adjust.photoId !== photoId) return;
      state.adjust.img = img;
      layoutAdjustCanvas();
      drawAdjust();
      updateAdjPreview();
    });
  }

  function layoutAdjustCanvas() {
    const wrap = $('#adjustWrap');
    const canvas = $('#adjustCanvas');
    const adj = state.adjust;
    if (!adj || !adj.img) return;
    const rw = wrap.clientWidth || 300;
    const rh = Math.max(220, wrap.clientHeight || 260);
    adj.dpr = devicePixelRatio || 1;
    canvas.width = Math.round(rw * adj.dpr);
    canvas.height = Math.round(rh * adj.dpr);
    canvas.style.width = rw + 'px';
    canvas.style.height = rh + 'px';
    const img = adj.img;
    adj.fitScale = Math.min(rw / img.naturalWidth, rh / img.naturalHeight);
    adj.scale = adj.fitScale * (adj.zoom || 1);
    adj.ox = (rw - img.naturalWidth * adj.scale) / 2 + (adj.panX || 0);
    adj.oy = (rh - img.naturalHeight * adj.scale) / 2 + (adj.panY || 0);
    adj.viewW = rw;
    adj.viewH = rh;
  }

  function toScreen(pt) {
    const a = state.adjust;
    return {
      x: (a.ox + pt.x * a.scale) * a.dpr,
      y: (a.oy + pt.y * a.scale) * a.dpr
    };
  }

  function toImg(sx, sy) {
    const a = state.adjust;
    return {
      x: (sx / a.dpr - a.ox) / a.scale,
      y: (sy / a.dpr - a.oy) / a.scale
    };
  }

  function setAdjustZoom(newZoom, centerCssX, centerCssY) {
    const adj = state.adjust;
    if (!adj || !adj.img) return;
    const z0 = adj.zoom || 1;
    const z1 = Math.max(1, Math.min(6, newZoom));
    if (Math.abs(z1 - z0) < 1e-4) return;
    const rw = adj.viewW, rh = adj.viewH;
    const cx = centerCssX != null ? centerCssX : rw / 2;
    const cy = centerCssY != null ? centerCssY : rh / 2;
    // keep the image point under (cx,cy) stable
    const imgPt = {
      x: (cx - ((rw - adj.img.naturalWidth * adj.fitScale * z0) / 2 + adj.panX)) / (adj.fitScale * z0),
      y: (cy - ((rh - adj.img.naturalHeight * adj.fitScale * z0) / 2 + adj.panY)) / (adj.fitScale * z0)
    };
    adj.zoom = z1;
    adj.scale = adj.fitScale * z1;
    adj.panX = cx - (rw - adj.img.naturalWidth * adj.scale) / 2 - imgPt.x * adj.scale;
    adj.panY = cy - (rh - adj.img.naturalHeight * adj.scale) / 2 - imgPt.y * adj.scale;
    layoutAdjustCanvas();
    drawAdjust();
  }

  function edgeMids(corners) {
    // 上、右、下、左 四邊中點（對應角 0-1, 1-2, 2-3, 3-0）
    return [
      { x: (corners[0].x + corners[1].x) / 2, y: (corners[0].y + corners[1].y) / 2, a: 0, b: 1 },
      { x: (corners[1].x + corners[2].x) / 2, y: (corners[1].y + corners[2].y) / 2, a: 1, b: 2 },
      { x: (corners[2].x + corners[3].x) / 2, y: (corners[2].y + corners[3].y) / 2, a: 2, b: 3 },
      { x: (corners[3].x + corners[0].x) / 2, y: (corners[3].y + corners[0].y) / 2, a: 3, b: 0 }
    ];
  }

  function drawLoupe(ctx, adj, imgPt) {
    if (!imgPt || !adj.img) return;
    const dpr = adj.dpr;
    const loupeR = 72 * dpr; // 夠大嘅放大鏡
    const zoom = 2.8;
    const finger = toScreen(imgPt);
    // 放大鏡放喺对角，唔遮住而家拖緊嗰個角
    const cw = ctx.canvas.width, ch = ctx.canvas.height;
    let lx = finger.x < cw / 2 ? cw - loupeR - 16 * dpr : loupeR + 16 * dpr;
    let ly = finger.y < ch / 2 ? ch - loupeR - 16 * dpr : loupeR + 16 * dpr;
    // 再保險：同手指距離太近就搬
    if (Math.hypot(lx - finger.x, ly - finger.y) < loupeR * 1.6) {
      lx = finger.x < cw / 2 ? cw - loupeR - 16 * dpr : loupeR + 16 * dpr;
      ly = finger.y < ch / 2 ? loupeR + 16 * dpr : ch - loupeR - 16 * dpr;
    }

    ctx.save();
    ctx.beginPath();
    ctx.arc(lx, ly, loupeR, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = '#111';
    ctx.fillRect(lx - loupeR, ly - loupeR, loupeR * 2, loupeR * 2);

    // 由原圖抽樣放大（唔經而家 pan/zoom，直睇角位）
    const srcR = loupeR / zoom;
    // 對應：loupe 中心 = imgPt
    const sx = imgPt.x - (srcR / adj.scale) * (adj.scale); // in image px: loupeR/zoom / scale? 
    // 用圖像像素：放大鏡顯示 img 上半徑 (loupeR/dpr)/zoom 嘅區域… 改用自然像素
    const imgRad = (loupeR / dpr) / zoom; // css px of loupe / zoom ≈ image? Better:
    // 顯示圖像上固定約 55 像素半徑 * (1/zoom relative)
    const sample = 48; // 原圖取樣半徑（像素）
    ctx.drawImage(
      adj.img,
      imgPt.x - sample, imgPt.y - sample, sample * 2, sample * 2,
      lx - loupeR, ly - loupeR, loupeR * 2, loupeR * 2
    );

    // 十字準心
    ctx.strokeStyle = 'rgba(56,189,248,0.95)';
    ctx.lineWidth = 2 * dpr;
    ctx.beginPath();
    ctx.moveTo(lx - 14 * dpr, ly); ctx.lineTo(lx + 14 * dpr, ly);
    ctx.moveTo(lx, ly - 14 * dpr); ctx.lineTo(lx, ly + 14 * dpr);
    ctx.stroke();
    ctx.restore();

    // 外框
    ctx.beginPath();
    ctx.arc(lx, ly, loupeR, 0, Math.PI * 2);
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3 * dpr;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(lx, ly, loupeR + 3 * dpr, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(15,23,42,0.7)';
    ctx.lineWidth = 4 * dpr;
    ctx.stroke();
  }

  function drawAdjust() {
    const adj = state.adjust;
    if (!adj || !adj.img) return;
    const canvas = $('#adjustCanvas');
    const ctx = canvas.getContext('2d');
    const dpr = adj.dpr;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(
      adj.img,
      adj.ox * dpr, adj.oy * dpr,
      adj.img.naturalWidth * adj.scale * dpr,
      adj.img.naturalHeight * adj.scale * dpr
    );

    const c = adj.corners.map(toScreen);
    ctx.strokeStyle = 'rgba(56,189,248,0.95)';
    ctx.lineWidth = 2.5 * dpr;
    ctx.beginPath();
    ctx.moveTo(c[0].x, c[0].y);
    for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
    ctx.closePath();
    ctx.stroke();

    // 邊線中點（可拖）
    const mids = edgeMids(adj.corners);
    mids.forEach((m) => {
      const p = toScreen(m);
      ctx.beginPath();
      ctx.rect(p.x - 11 * dpr, p.y - 11 * dpr, 22 * dpr, 22 * dpr);
      ctx.fillStyle = 'rgba(56,189,248,0.95)';
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2 * dpr;
      ctx.stroke();
    });

    if (adj.dual) {
      const sp = spinePoints(adj.corners, adj.spineX);
      const st = toScreen(sp.top), sb = toScreen(sp.bot);
      ctx.strokeStyle = 'rgba(167,139,250,0.95)';
      ctx.lineWidth = 3 * dpr;
      ctx.setLineDash([6 * dpr, 4 * dpr]);
      ctx.beginPath();
      ctx.moveTo(st.x, st.y);
      ctx.lineTo(sb.x, sb.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc((st.x + sb.x) / 2, (st.y + sb.y) / 2, 14 * dpr, 0, Math.PI * 2);
      ctx.fillStyle = '#a78bfa';
      ctx.fill();
    }

    c.forEach((p, i) => {
      const rad = (i === adj.selected ? 16 : 14) * dpr;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
      ctx.fillStyle = i === adj.selected ? '#38bdf8' : '#fff';
      ctx.fill();
      ctx.strokeStyle = '#0ea5e9';
      ctx.lineWidth = 2.5 * dpr;
      ctx.stroke();
    });

    if (adj.loupePt) drawLoupe(ctx, adj, adj.loupePt);
  }

  let previewTimer = null;
  function updateAdjPreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(doAdjPreview, 50);
  }

  async function doAdjPreview() {
    const adj = state.adjust;
    if (!adj || !adj.img) return;
    const dual = !!adj.dual;
    const prevW = state.pdfWidth;
    state.pdfWidth = 600;
    let pages;
    try { pages = splitAndWarp(adj.img, adj.corners, adj.spineX, dual); }
    finally { state.pdfWidth = prevW; }
    const box = $('#adjPreview');
    box.className = 'preview-pages' + (pages.length === 1 ? ' single' : '');
    const left = $('#prevLeft'), right = $('#prevRight');
    async function paint(canvas, dataUrl) {
      if (!dataUrl) { canvas.style.display = 'none'; return; }
      canvas.style.display = 'block';
      const im = await loadImage(dataUrl);
      canvas.width = im.naturalWidth;
      canvas.height = im.naturalHeight;
      canvas.getContext('2d').drawImage(im, 0, 0);
    }
    if (pages.length === 1) {
      await paint(left, pages[0].dataUrl);
      right.style.display = 'none';
    } else {
      right.style.display = 'block';
      await paint(left, pages[0].dataUrl);
      await paint(right, pages[1].dataUrl);
    }
  }

  function hitTest(sx, sy) {
    const adj = state.adjust;
    const r = 28 * adj.dpr;
    const c = adj.corners.map(toScreen);
    for (let i = 0; i < 4; i++) {
      if (Math.hypot(c[i].x - sx, c[i].y - sy) <= r) return { type: 'corner', i };
    }
    // 四邊中點（正方形 handle）
    const mids = edgeMids(adj.corners);
    for (let i = 0; i < 4; i++) {
      const p = toScreen(mids[i]);
      if (Math.abs(p.x - sx) <= 20 * adj.dpr && Math.abs(p.y - sy) <= 20 * adj.dpr) {
        return { type: 'edge', i, a: mids[i].a, b: mids[i].b };
      }
    }
    // 整段邊都可拖（中點以外）
    for (let i = 0; i < 4; i++) {
      const a = c[i], b = c[(i + 1) % 4];
      if (distToSeg(sx, sy, a.x, a.y, b.x, b.y) < 16 * adj.dpr) {
        const m = mids[i];
        return { type: 'edge', i, a: m.a, b: m.b };
      }
    }
    if (adj.dual) {
      const sp = spinePoints(adj.corners, adj.spineX);
      const st = toScreen(sp.top), sb = toScreen(sp.bot);
      const mx = (st.x + sb.x) / 2, my = (st.y + sb.y) / 2;
      if (Math.hypot(mx - sx, my - sy) <= r + 6) return { type: 'spine' };
      if (distToSeg(sx, sy, st.x, st.y, sb.x, sb.y) < 18 * adj.dpr) return { type: 'spine' };
    }
    return null;
  }

  function distToSeg(px, py, x1, y1, x2, y2) {
    const A = px - x1, B = py - y1, C = x2 - x1, D = y2 - y1;
    const len = C * C + D * D || 1;
    let t = Math.max(0, Math.min(1, (A * C + B * D) / len));
    return Math.hypot(px - (x1 + t * C), py - (y1 + t * D));
  }

  function bindAdjustPointer() {
    const canvas = $('#adjustCanvas');
    let drag = null;
    let pinch = null;
    let panDrag = null;

    function pos(e) {
      const rect = canvas.getBoundingClientRect();
      const t = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
      return {
        x: (t.clientX - rect.left) * (state.adjust ? state.adjust.dpr : devicePixelRatio),
        y: (t.clientY - rect.top) * (state.adjust ? state.adjust.dpr : devicePixelRatio),
        cssX: t.clientX - rect.left,
        cssY: t.clientY - rect.top
      };
    }

    function touchDist(e) {
      const rect = canvas.getBoundingClientRect();
      const a = e.touches[0], b = e.touches[1];
      return {
        d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
        cx: ((a.clientX + b.clientX) / 2) - rect.left,
        cy: ((a.clientY + b.clientY) / 2) - rect.top
      };
    }

    function onDown(e) {
      if (!state.adjust) return;
      if (e.touches && e.touches.length === 2) {
        e.preventDefault();
        drag = null;
        panDrag = null;
        const td = touchDist(e);
        pinch = { d0: td.d, z0: state.adjust.zoom || 1, cx: td.cx, cy: td.cy, panX0: state.adjust.panX, panY0: state.adjust.panY };
        return;
      }
      e.preventDefault();
      const p = pos(e);
      const hit = hitTest(p.x, p.y);
      if (hit) {
        drag = hit;
        if (hit.type === 'corner') state.adjust.selected = hit.i;
        if (hit.type === 'edge') {
          const p0 = state.adjust.corners[hit.a];
          drag.last = { x: toImg(p.x, p.y).x, y: toImg(p.x, p.y).y };
        }
        const imgPt = toImg(p.x, p.y);
        state.adjust.loupePt = { x: imgPt.x, y: imgPt.y };
        drawAdjust();
        return;
      }
      // 單指喺空白位拖＝平移（放大後尤甚）
      if ((state.adjust.zoom || 1) > 1.02) {
        panDrag = { x: p.cssX, y: p.cssY, panX0: state.adjust.panX, panY0: state.adjust.panY };
      }
    }

    function onMove(e) {
      if (!state.adjust) return;
      if (e.touches && e.touches.length === 2 && pinch) {
        e.preventDefault();
        const td = touchDist(e);
        const ratio = td.d / Math.max(1, pinch.d0);
        setAdjustZoom(pinch.z0 * ratio, td.cx, td.cy);
        // also pan with midpoint delta
        state.adjust.panX = pinch.panX0 + (td.cx - pinch.cx);
        state.adjust.panY = pinch.panY0 + (td.cy - pinch.cy);
        layoutAdjustCanvas();
        drawAdjust();
        return;
      }
      if (drag) {
        e.preventDefault();
        const p = pos(e);
        const imgPt = toImg(p.x, p.y);
        const img = state.adjust.img;
        imgPt.x = Math.max(0, Math.min(img.naturalWidth, imgPt.x));
        imgPt.y = Math.max(0, Math.min(img.naturalHeight, imgPt.y));
        if (drag.type === 'corner') {
          state.adjust.corners[drag.i] = imgPt;
          state.adjust.loupePt = { x: imgPt.x, y: imgPt.y };
        } else if (drag.type === 'edge') {
          const last = drag.last || imgPt;
          const dx = imgPt.x - last.x;
          const dy = imgPt.y - last.y;
          const ca = state.adjust.corners[drag.a];
          const cb = state.adjust.corners[drag.b];
          ca.x = Math.max(0, Math.min(img.naturalWidth, ca.x + dx));
          ca.y = Math.max(0, Math.min(img.naturalHeight, ca.y + dy));
          cb.x = Math.max(0, Math.min(img.naturalWidth, cb.x + dx));
          cb.y = Math.max(0, Math.min(img.naturalHeight, cb.y + dy));
          drag.last = { x: imgPt.x, y: imgPt.y };
          state.adjust.loupePt = {
            x: (ca.x + cb.x) / 2,
            y: (ca.y + cb.y) / 2
          };
        } else if (drag.type === 'spine') {
          state.adjust.spineX = imgPt.x;
          state.adjust.loupePt = { x: imgPt.x, y: imgPt.y };
        }
        drawAdjust();
        updateAdjPreview();
        return;
      }
      if (panDrag) {
        e.preventDefault();
        const p = pos(e);
        state.adjust.panX = panDrag.panX0 + (p.cssX - panDrag.x);
        state.adjust.panY = panDrag.panY0 + (p.cssY - panDrag.y);
        layoutAdjustCanvas();
        drawAdjust();
      }
    }

    function onUp() {
      drag = null; pinch = null; panDrag = null;
      if (state.adjust) { state.adjust.loupePt = null; drawAdjust(); }
    }

    canvas.addEventListener('mousedown', onDown);
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    window.addEventListener('touchmove', onMove, { passive: false });
    window.addEventListener('touchend', onUp);
    canvas.addEventListener('wheel', (e) => {
      if (!state.adjust) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      setAdjustZoom((state.adjust.zoom || 1) * factor, e.clientX - rect.left, e.clientY - rect.top);
    }, { passive: false });

    window.addEventListener('keydown', (e) => {
      if (!$('#modalAdjust').classList.contains('show') || !state.adjust) return;
      const step = e.shiftKey ? 5 : 1;
      const i = state.adjust.selected;
      const c = state.adjust.corners[i];
      if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
        e.preventDefault();
        if (e.key === 'ArrowLeft') c.x -= step;
        if (e.key === 'ArrowRight') c.x += step;
        if (e.key === 'ArrowUp') c.y -= step;
        if (e.key === 'ArrowDown') c.y += step;
        drawAdjust();
        updateAdjPreview();
      }
    });

    window.addEventListener('resize', () => {
      if ($('#modalAdjust').classList.contains('show') && state.adjust) {
        layoutAdjustCanvas();
        drawAdjust();
      }
    });
  }

  function applyAdjust() {
    const adj = state.adjust;
    if (!adj) return;
    const ph = state.photos.find(p => p.id === adj.photoId);
    if (!ph) return;
    const dual = !!adj.dual;
    ph.manual = {
      corners: adj.corners.map(c => ({ ...c })),
      spineX: adj.spineX,
      dual
    };
    showProgress(true, '套用切割…', 1, 1);
    setTimeout(async () => {
      ph.pages = splitAndWarp(adj.img, ph.manual.corners, ph.manual.spineX, dual);
      showProgress(false);
      $('#modalAdjust').classList.remove('show');
      state.adjust = null;
      renderList();
      toast('已套用手動調整');
    }, 30);
  }

  function resetAdjust() {
    const adj = state.adjust;
    if (!adj) return;
    const ph = state.photos.find(p => p.id === adj.photoId);
    if (!ph) return;
    ph.manual = null;
    adj.corners = ph.auto.corners.map(c => ({ ...c }));
    adj.spineX = ph.auto.spineX;
    adj.dual = !!ph.auto.dual;
    adj.zoom = 1; adj.panX = 0; adj.panY = 0;
    syncAdjModeButtons();
    layoutAdjustCanvas();
    drawAdjust();
    updateAdjPreview();
    toast('已重設返自動結果');
  }

  /* ----- PDF ----- */
  async function exportPdf() {
    if (!window.jspdf) {
      toast('jsPDF 載入失敗，請檢查網絡後重新整理', 'err');
      return;
    }
    const pages = [];
    state.photos.forEach(ph => ph.pages.forEach(pg => pages.push(pg)));
    if (!pages.length) { toast('未有頁面', 'warn'); return; }

    showProgress(true, '產生 PDF 緊…', 0, pages.length);
    const { jsPDF } = window.jspdf;

    // 先讀晒每頁真實長闊比；統一高度，闊度跟每頁比例（唔夾硬 A4）
    const metas = [];
    for (let i = 0; i < pages.length; i++) {
      const im = await loadImage(pages[i].dataUrl);
      metas.push({ w: im.naturalWidth, h: im.naturalHeight, dataUrl: pages[i].dataUrl });
      showProgress(true, '準備 PDF 頁面…', i + 1, pages.length);
      await yieldToUI();
    }
    const TARGET_H = 842; // pt，高度對齊；闊度按比例
    let doc = null;
    for (let i = 0; i < metas.length; i++) {
      const { w, h, dataUrl } = metas[i];
      const aspect = w / Math.max(1, h);
      const pageH = TARGET_H;
      const pageW = Math.max(200, Math.min(2000, TARGET_H * aspect));
      if (!doc) {
        doc = new jsPDF({ unit: 'pt', format: [pageW, pageH], orientation: pageW >= pageH ? 'l' : 'p' });
      } else {
        doc.addPage([pageW, pageH], pageW >= pageH ? 'l' : 'p');
      }
      // 舖滿頁面，唔留白拉歪
      doc.addImage(dataUrl, 'JPEG', 0, 0, pageW, pageH);
      showProgress(true, '產生 PDF 緊…', i + 1, metas.length);
      await yieldToUI();
    }
    doc.save('書本掃描.pdf');
    showProgress(false);
    toast('PDF 已下載（跟書頁比例）');
  }

  /* ----- Events ----- */
  function bindUI() {
    $('#btnHomeSettings').onclick = () => $('#homeSettings').classList.toggle('open');
    $('#setQuality').onchange = (e) => { state.quality = parseFloat(e.target.value); };
    $('#setPdfWidth').onchange = (e) => { state.pdfWidth = parseInt(e.target.value, 10); };

    $('#btnOpenCamera').onclick = () => startCamera();
    $('#btnOpenUpload').onclick = () => $('#fileUpload').click();
    $('#btnGoList').onclick = () => showScreen('list');

    $('#btnCamBack').onclick = () => { stopCamera(); showScreen(state.photos.length ? 'list' : 'home'); };
    $('#btnCamToList').onclick = () => { stopCamera(); showScreen('list'); };
    $('#btnShutter').onclick = () => shutter();
    $('#btnCamFlip').onclick = () => {
      state.facing = state.facing === 'environment' ? 'user' : 'environment';
      startCamera();
    };
    $('#btnCamFallback').onclick = () => $('#fileCapture').click();

    $('#btnListHome').onclick = () => showScreen('home');
    $('#btnListAdd').onclick = () => {
      const bar = document.createElement('div');
      bar.style.cssText = 'position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:150;display:flex;gap:8px;background:var(--card);padding:10px;border-radius:12px;border:1px solid var(--border)';
      bar.innerHTML = '<button class="btn btn-sm btn-primary" type="button" id="tmpUp">🖼️ 上載</button><button class="btn btn-sm btn-ghost" type="button" id="tmpCam">📷 相機</button><button class="btn btn-sm btn-ghost" type="button" id="tmpX">關閉</button>';
      document.body.appendChild(bar);
      $('#tmpUp').onclick = () => { bar.remove(); $('#fileUpload').click(); };
      $('#tmpCam').onclick = () => { bar.remove(); startCamera(); };
      $('#tmpX').onclick = () => bar.remove();
    };
    $('#btnListCam').onclick = () => startCamera();
    $('#btnExportPdf').onclick = () => exportPdf();
    $('#btnClearAll').onclick = () => {
      if (!state.photos.length) { toast('清單已經空'); return; }
      if (!confirm('清空全部相片同頁面？只會清呢個網頁記憶體，唔會刪你相簿原圖。')) return;
      state.photos = [];
      state.adjust = null;
      renderList();
      refreshStats();
      toast('已清空，記憶體已釋放');
    };

    $('#btnAdjClose').onclick = () => { $('#modalAdjust').classList.remove('show'); state.adjust = null; };
    $('#btnAdjReset').onclick = () => resetAdjust();
    $('#btnAdjApply').onclick = () => applyAdjust();
    $('#btnModeDual').onclick = () => {
      if (!state.adjust) return;
      state.adjust.dual = true;
      syncAdjModeButtons();
      drawAdjust();
      updateAdjPreview();
    };
    $('#btnModeSingle').onclick = () => {
      if (!state.adjust) return;
      state.adjust.dual = false;
      syncAdjModeButtons();
      drawAdjust();
      updateAdjPreview();
    };
    $('#btnZoomIn').onclick = () => setAdjustZoom((state.adjust && state.adjust.zoom || 1) * 1.35);
    $('#btnZoomOut').onclick = () => setAdjustZoom((state.adjust && state.adjust.zoom || 1) / 1.35);
    $('#btnZoomReset').onclick = () => {
      if (!state.adjust) return;
      state.adjust.zoom = 1; state.adjust.panX = 0; state.adjust.panY = 0;
      layoutAdjustCanvas(); drawAdjust();
    };

    $('#fileUpload').onchange = (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      addFiles(files);
    };
    $('#fileCapture').onchange = (e) => {
      const files = Array.from(e.target.files || []);
      e.target.value = '';
      addFiles(files);
    };
    $('#fileReplace').onchange = (e) => {
      const files = Array.from(e.target.files || []);
      const id = state.replaceTarget;
      state.replaceTarget = null;
      e.target.value = '';
      if (files[0]) addFiles(files, id);
    };

    bindAdjustPointer();
  }

  /* ----- Init ----- */
  async function init() {
    bindUI();
    updateLibStatus();
    refreshStats();
    // Sortable / jspdf / exifr already via script tags
    setTimeout(updateLibStatus, 500);
    loadOpenCV().then(() => {
      updateLibStatus();
      if (!state.opencvReady) toast('OpenCV 載入唔到，會用後備切割（仍然可手動調）', 'warn');
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
