<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3a34">
<title>書影 BookScan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a34'/%3E%3Cpath d='M12 18c8-3 14-2 20 3v27c-6-5-12-6-20-3zM52 18c-8-3-14-2-20 3v27c6-5 12-6 20-3z' fill='%23f4efe4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --surface-2:#ece7dc; --ink:#22201c; --ink-2:#5d5850; --line:#d8d1c3;
  --accent:#1f6b5c; --accent-ink:#fff; --accent-soft:#d6ebe5; --warn:#b5651d; --warn-soft:#f6e3cf; --danger:#b3261e;
  --handle:#ff7a1a; --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161a19; --surface:#1f2423; --surface-2:#2a302e; --ink:#ece8df; --ink-2:#a9a49a; --line:#3a413f;
    --accent:#4fb39c; --accent-ink:#0d1513; --accent-soft:#1f3a34; --warn:#e2a35c; --warn-soft:#3b2d1e; --danger:#ef6b62; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;overscroll-behavior-y:auto}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-height:40px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:var(--ink-2)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent}
button.danger{color:var(--danger)}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
.icon{width:18px;height:18px;flex:none}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.bar{display:flex;align-items:center;gap:8px;min-height:56px;flex-wrap:wrap;padding:6px 0}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;margin-right:auto}
.brand small{font-weight:400;color:var(--ink-2);font-size:13px}
.title-input{font-weight:700;font-size:17px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;min-width:0;flex:1 1 160px}
.title-input:focus{border-color:var(--line);background:var(--surface);outline:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:8px 0 10px}
.status{font-size:13px;color:var(--ink-2);padding:0 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.progress{height:4px;background:var(--surface-2);border-radius:4px;overflow:hidden;flex:1 1 120px;max-width:280px}
.progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
main{padding:12px 0 120px}
.empty{border:2px dashed var(--line);border-radius:16px;padding:32px 20px;text-align:center;color:var(--ink-2);background:var(--surface)}
.empty h2{color:var(--ink);margin:.2em 0 .5em;font-size:19px}
.empty ol{text-align:left;display:inline-block;margin:8px auto;padding-left:20px}
.drop-active .empty,.drop-active #grid{outline:3px solid var(--accent);outline-offset:4px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.card.sel{outline:3px solid var(--accent)}
.card.sortable-ghost{opacity:.35}
.card-top{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--line);font-size:13px}
.handle{cursor:grab;touch-action:none;padding:6px 4px;color:var(--ink-2);font-size:18px;line-height:1;user-select:none}
.num{font-weight:700}
.pn{color:var(--ink-2);margin-right:auto}
.card-top input{width:20px;height:20px;accent-color:var(--accent)}
.thumbs{display:flex;justify-content:center;align-items:center;gap:3px;height:180px;padding:8px;background:var(--surface-2);cursor:pointer;position:relative}
.thumbs .tw{position:relative;height:100%;max-width:calc(50% - 2px);display:flex;align-items:center;justify-content:center}
.thumbs .tw.solo{max-width:100%}
.thumbs img{max-height:100%;max-width:100%;object-fit:contain;box-shadow:0 1px 4px rgba(0,0,0,.25);background:#fff}
.thumbs .pl{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;line-height:16px;background:rgba(0,0,0,.62);color:#fff;padding:0 7px;border-radius:999px;white-space:nowrap}
.thumbs .pl:empty{display:none}
.thumbs img.off{opacity:.25;filter:grayscale(1)}
.thumbs .spin,.thumbs .err{font-size:13px;color:var(--ink-2);text-align:center;padding:8px}
.thumbs .err{color:var(--danger)}
.badges{display:flex;gap:4px;flex-wrap:wrap;padding:6px 8px 0}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--accent-soft);color:var(--accent)}
.card-actions{display:flex;gap:4px;padding:8px}
.card-actions button{flex:1;justify-content:center;padding:6px 6px;font-size:13px;min-height:36px}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px;display:none;gap:6px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:calc(100% - 24px);overflow-x:auto}
.selbar.show{display:flex}
.selbar button{background:transparent;color:inherit;border-color:rgba(255,255,255,.25)}
.selbar span{padding:0 8px;white-space:nowrap}
/* 書架 */
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.book{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;gap:12px;box-shadow:var(--shadow)}
.book .cov{width:70px;height:96px;background:var(--surface-2);border-radius:6px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.book .cov img{width:100%;height:100%;object-fit:cover}
.book .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.book .meta b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.book .meta small{color:var(--ink-2)}
.book .meta .row{display:flex;gap:6px;margin-top:auto}
.storage{margin-top:24px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px}
.storage h3{margin:0 0 6px;font-size:16px}
.storage p{margin:6px 0;color:var(--ink-2);font-size:14px}
.meter{height:8px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:var(--accent)}
/* 對話框 */
dialog{border:none;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 32px)}
.dlg header{padding:16px 18px 8px;font-weight:700;font-size:17px}
.dlg .body{padding:4px 18px 8px;overflow:auto}
.dlg footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;flex-wrap:wrap}
.field{margin:12px 0}
.field>label{display:block;font-weight:600;margin-bottom:6px}
.field .hint{font-size:13px;color:var(--ink-2);margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;justify-content:center}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;width:100%;min-height:40px}
.check{display:flex;gap:8px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
/* 全螢幕層：編輯器 / 相機 */
.overlay{position:fixed;inset:0;z-index:50;background:#111;color:#eee;display:none;flex-direction:column}
.overlay.show{display:flex}
.ov-top{display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));background:#1b1b1b}
.ov-top .t{margin-right:auto;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.overlay button{background:#2a2a2a;border-color:#3a3a3a;color:#eee}
.overlay button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.overlay button.on{background:#20473f;border-color:#4fb39c;color:#fff}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.stage canvas.view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.loupe{position:absolute;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.6),0 8px 24px rgba(0,0,0,.6);pointer-events:none;display:none;background:#000}
.ov-tools{display:flex;gap:6px;padding:8px 10px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:#1b1b1b;overflow-x:auto;align-items:center}
.ov-tools .sep{width:1px;align-self:stretch;background:#3a3a3a;margin:0 2px;flex:none}
.hintline{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(0,0,0,.65);padding:6px 12px;border-radius:999px;font-size:13px;pointer-events:none;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
.zoomctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoomctl button{width:44px;height:44px;justify-content:center;padding:0;font-size:20px;background:rgba(30,30,30,.85)}
/* 相機 */
#camera video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#camera canvas.ovl{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.cam-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom));background:#111}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid #fff !important;background:#fff !important;box-shadow:inset 0 0 0 4px #111;padding:0;justify-content:center}
.shutter:active{transform:scale(.94)}
.cam-last{width:56px;height:56px;border-radius:8px;overflow:hidden;background:#222;display:flex;align-items:center;justify-content:center;font-size:12px;position:relative}
.cam-last img{width:100%;height:100%;object-fit:cover}
.cam-last b{position:absolute;right:2px;bottom:2px;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:0 6px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.flash.go{opacity:.8;transition:none}
dialog.wide{width:min(1100px,calc(100vw - 24px))}
.preview-pages{display:flex;gap:8px;justify-content:center;align-items:flex-start}
.preview-pages figure{margin:0;text-align:center;font-size:13px;color:var(--ink-2);flex:0 1 auto;min-width:0}
.preview-pages img{display:block;max-width:100%;max-height:68vh;margin:0 auto 4px;box-shadow:0 2px 10px rgba(0,0,0,.3);background:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:600px){
  #grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .thumbs{height:130px;padding:6px}
  .card-actions .ic{display:none}
  .card-actions button{font-size:13px;padding:4px}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar" id="bar"></div>
  </div>
</header>
<div class="wrap">
  <div id="toolbarArea"></div>
  <main id="main"></main>
</div>

<div class="selbar" id="selbar"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileInput" accept="image/*,.heic,.heif" multiple class="sr">
<input type="file" id="replaceInput" accept="image/*" class="sr">

<!-- 編輯器 -->
<div class="overlay" id="editor" aria-label="調整頁面">
  <div class="ov-top">
    <button id="edCancel">取消</button>
    <div class="t" id="edTitle">調整</div>
    <button class="primary" id="edDone">完成</button>
  </div>
  <div class="stage" id="edStage">
    <canvas class="view" id="edCanvas"></canvas>
    <canvas class="loupe" id="loupe"></canvas>
    <div class="hintline" id="edHint">拖角點或者拖邊；兩指或滾輪放大</div>
    <div class="zoomctl">
      <button id="zIn" aria-label="放大">＋</button>
      <button id="zOut" aria-label="縮細">－</button>
      <button id="zFit" aria-label="全圖">⤢</button>
    </div>
  </div>
  <div class="ov-tools" id="edTools"></div>
</div>

<!-- 相機 -->
<div class="overlay" id="camera" aria-label="影相">
  <div class="ov-top">
    <button id="camClose">完成</button>
    <div class="t" id="camTitle">影相</div>
    <button id="camGuide" class="on">對準框</button>
    <button id="camShape">跨頁框</button>
  </div>
  <div class="stage" id="camStage">
    <video id="camVideo" playsinline muted autoplay></video>
    <canvas class="ovl" id="camOverlay"></canvas>
    <div class="hintline" id="camHint">將本書放喺框入面</div>
    <div class="flash" id="camFlash"></div>
  </div>
  <div class="cam-bar">
    <div class="cam-last" id="camLast">未影</div>
    <button class="shutter" id="camShutter" aria-label="影相"></button>
    <div style="width:56px;text-align:center;font-size:12px;color:#aaa" id="camRes"></div>
  </div>
</div>

<dialog id="dlg"></dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
